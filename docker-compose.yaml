
services:
  strapi:
    # Usamos la imagen oficial y segura de Node 24 (basada en Debian para evitar errores de sqlite3)
    image: node:24
    container_name: strapi-dev
    working_dir: /app
    ports:
      - "1337:1337"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"